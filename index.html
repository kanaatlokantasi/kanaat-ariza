<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1f2937">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Arıza-Eksik Ürün">
<link rel="manifest" href="manifest.json">
<title>Arıza ve Eksik Ürün</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,system-ui,Segoe UI,Roboto,sans-serif;background:#f3f4f6;color:#111827;padding-bottom:84px}
header{background:#1f2937;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.brand{font-weight:700}
#who{font-size:13px;opacity:.85}
main{max-width:560px;margin:0 auto;padding:14px}
footer{max-width:560px;margin:0 auto;padding:8px 14px;font-size:12px;color:#6b7280;text-align:center}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #e5e7eb;display:flex;justify-content:space-around;padding-bottom:env(safe-area-inset-bottom)}
nav a{flex:1;text-align:center;padding:14px 4px;font-size:14px;color:#6b7280;text-decoration:none}
nav a.on{color:#111827;font-weight:700;border-top:3px solid #1f2937;margin-top:-1px}
h2{margin:0 0 8px;font-size:20px}
h3{margin:22px 0 8px;font-size:16px}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.item{display:block;background:#fff;border-radius:10px;padding:11px 12px;margin-bottom:8px;color:inherit;text-decoration:none;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.item p{margin:6px 0 0;font-size:14px}
.muted{color:#6b7280;font-size:13px;display:block;margin-top:3px}
.btn{display:inline-block;background:#1f2937;color:#fff;border:0;border-radius:10px;padding:11px 14px;font-size:15px;text-decoration:none;text-align:center;cursor:pointer;margin:4px 0}
.btn.red{background:#dc2626}
.btn.dark{background:#b45309}
.btn.green{background:#16a34a}
.btn.ghost{background:#e5e7eb;color:#111827}
.btn.big{display:block;width:100%;padding:18px;font-size:18px;font-weight:700;margin:6px 0 12px}
.btn:disabled{opacity:.5}
.link{background:none;border:0;color:#2563eb;font-size:14px;cursor:pointer}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.row>*{flex:1}
label{display:block;font-size:14px;margin:10px 0 2px;color:#374151}
input,select,textarea{width:100%;padding:10px;font-size:16px;border:1px solid #d1d5db;border-radius:8px;background:#fff;margin-top:3px}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:#e5e7eb;margin-left:6px}
.p-acil{background:#fee2e2;color:#991b1b}
.note{background:#dcfce7;color:#166534;padding:10px;border-radius:10px;margin-bottom:12px}
.warn{background:#fef9c3;color:#854d0e;padding:10px;border-radius:10px;margin-bottom:12px;font-size:14px}
.err{color:#b91c1c;font-size:14px;min-height:1em}
.ph{max-width:100%;border-radius:8px;margin-top:8px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0 0 16px}
.tile{display:flex;align-items:center;justify-content:center;min-height:110px;border-radius:14px;font-size:17px;font-weight:700;text-decoration:none;text-align:center;padding:10px;color:#fff}
.tile.red{background:#dc2626}
.tile.amber{background:#b45309}
.mono{font-family:ui-monospace,monospace;font-size:12px;word-break:break-all;color:#374151}
#qrc{margin:10px 0}
</style>
</head>
<body>
<header><div class="brand">Arıza · Eksik Ürün</div><div id="who"></div></header>
<main id="app"><p class="muted">Yükleniyor…</p></main>
<nav id="nav"></nav>
<footer>Sürüm 1.11</footer>
<script type="module" src="app.js"></script>
</body>
</html>
